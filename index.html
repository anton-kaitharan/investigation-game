<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Killer in the Room</title>
<style>

#notebook{position:fixed;left:12px;top:12px;width:270px;max-height:calc(100% - 24px);overflow:auto;background:rgba(18,12,8,.82);border:1px solid #5a4630;border-radius:6px;padding:12px 14px;box-shadow:0 4px 24px rgba(0,0,0,.6);z-index:2}

<body>
<div id="timer"><span id="t">60</span></div>
<div id="notebook"><h2>Notebook</h2><ul id="notes"></ul></div>
<div id="audio"><button id="mute" aria-label="Mute sound" title="Mute / unmute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><g id="waves"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></g><path id="slash" class="hidden" d="M17 9l5 6M22 9l-5 6"/></svg></button><input id="vol" type="range" min="0" max="100" value="60" aria-label="Volume"></div>
<div id="tags"></div>
<div id="speech" class="hidden"><span id="who"></span><span id="said"></span></div>
<div id="actions" class="hidden"><button id="back">Back</button><button id="accuse" class="accuse">Accuse</button></div>
<div id="intro" class="overlay"><div class="card"><h1>The Killer in the Room</h1>
<p>Someone has poisoned the wine. You have <b>60 seconds</b> to find the killer among five suspects.</p>
<p>Two of them are lying, and the killer is one of the liars. Honest suspects always tell the truth; liars never do. Questioning a suspect costs <b>8 seconds</b>.</p>
<button id="start">Begin</button></div></div>
<div id="end" class="overlay hidden"><div class="card"><h1 id="endTitle"></h1><p id="endText"></p><button id="again">Play again</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// <gen>
const NAMES=['Colonel Hale','Lady Violet','Dr. Thorne','Rosa Vance','Jonah Pike'];
function stmtTrue(s,liars,killer){return s.type===0?!liars[s.t]:s.type===1?liars[s.t]:s.type===2?s.t!==killer:s.t===killer;}
function consistentWorlds(stmts){
  const w=[];
  for(let a=0;a<5;a++)for(let b=a+1;b<5;b++){
    const L=[0,1,2,3,4].map(i=>i===a||i===b);
    for(const k of [a,b])if(stmts.every((s,i)=>stmtTrue(s,L,k)===!L[i]))w.push({a,b,k});
  }
  return w;
}
function generateCase(){
  const r=n=>Math.floor(Math.random()*n);
  for(;;){
    const a=r(5);let b;do b=r(5);while(b===a);
    const liars=[0,1,2,3,4].map(i=>i===a||i===b),killer=Math.random()<.5?a:b,stmts=[];
    for(let i=0;i<5;i++){
      let s;
      do{let t;do t=r(5);while(t===i);s={type:r(4),t};}while(stmtTrue(s,liars,killer)===liars[i]);
      stmts.push(s);
    }
    if(new Set(consistentWorlds(stmts).map(w=>w.k)).size===1)return{liars,killer,stmts};
  }
}
function stmtText(s){const n=NAMES[s.t];return[n+' is telling the truth.',n+' is lying.',n+" didn't do it.",'It was '+n+'.'][s.type];}
// </gen>

const $=id=>document.getElementById(id);

// ---------- Sound (procedural WebAudio, no asset files) ----------
// Add a new sound: Sfx.define('name',(t,out)=>{Sfx.tone(out,{...});Sfx.noise(out,{...});},{gap:seconds,gain:1}); then call Sfx.play('name').
const Sfx=(()=>{
  const AC=window.AudioContext||window.webkitAudioContext,defs={},last={},MAX_VOICES=4;
  let ctx,master,sfxBus,ambBus,noiseBuf,voices=0,ambOn=false,ambNodes=null,crackleT=0,tickT=0;
  const saved=(()=>{try{return JSON.parse(localStorage.getItem('kir-audio'))||{}}catch(e){return{}}})();
  const S={vol:saved.vol!==undefined?saved.vol:.6,muted:!!saved.muted};
  const save=()=>{try{localStorage.setItem('kir-audio',JSON.stringify(S))}catch(e){}};
  const level=()=>S.muted?0:Math.pow(S.vol,1.8)*.9;
  function applyLevel(){if(ctx)master.gain.setTargetAtTime(level(),ctx.currentTime,.05);}
  function init(){
    if(!AC)return false;
    if(!ctx){
      ctx=new AC();master=ctx.createGain();master.gain.value=level();
      const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;
      master.connect(comp);comp.connect(ctx.destination);
      sfxBus=ctx.createGain();sfxBus.gain.value=.8;sfxBus.connect(master);
      ambBus=ctx.createGain();ambBus.gain.value=0;ambBus.connect(master);
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(ctx.state!=='running')ctx.resume();
    return true;
  }
  function tone(out,{f=440,f2,type='sine',t=0,dur=.2,gain=.2,attack=.005,lp}){
    const n=ctx.currentTime+t,o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+dur);
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(gain,n+attack);g.gain.exponentialRampToValueAtTime(.0001,n+dur);
    let node=o;if(lp){const b=ctx.createBiquadFilter();b.type='lowpass';b.frequency.value=lp;o.connect(b);node=b;}
    node.connect(g);g.connect(out);o.start(n);o.stop(n+dur+.05);
  }
  function noise(out,{t=0,dur=.2,gain=.1,type='bandpass',f=1000,f2,q=1,attack=.005}){
    const n=ctx.currentTime+t,s=ctx.createBufferSource(),b=ctx.createBiquadFilter(),g=ctx.createGain();
    s.buffer=noiseBuf;s.loop=true;b.type=type;b.Q.value=q;b.frequency.setValueAtTime(f,n);if(f2)b.frequency.exponentialRampToValueAtTime(f2,n+dur);
    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(gain,n+attack);g.gain.exponentialRampToValueAtTime(.0001,n+dur);
    s.connect(b);b.connect(g);g.connect(out);s.start(n,Math.random());s.stop(n+dur+.05);
  }
  function define(name,fn,opt={}){defs[name]={fn,gap:opt.gap||.08,gain:opt.gain||1};}
  function play(name){
    const d=defs[name];if(!d||S.muted||S.vol<=0||!init())return;
    const now=ctx.currentTime;if(now-(last[name]||-9)<d.gap||voices>=MAX_VOICES)return;
    last[name]=now;voices++;
    const out=ctx.createGain();out.gain.value=d.gain;out.connect(sfxBus);
    d.fn(0,out);setTimeout(()=>{voices--;out.disconnect();},2600);
  }
  function crackle(){
    if(!ambOn)return;
    if(ctx.state==='running'&&!S.muted&&!document.hidden){
      const n=1+(Math.random()*3|0);
      for(let i=0;i<n;i++)noise(ambBus,{t:i*(.02+Math.random()*.05),dur:.02+Math.random()*.03,gain:.05+Math.random()*.09,type:'highpass',f:1800+Math.random()*3000,q:.7,attack:.001});
    }
    crackleT=setTimeout(crackle,250+Math.random()*1800);
  }
  function ambience(on){
    if(on===ambOn)return;
    if(!init())return;
    ambOn=on;const n=ctx.currentTime;
    if(on){
      if(!ambNodes){
        const nodes=[],drone=ctx.createGain(),lp=ctx.createBiquadFilter();
        lp.type='lowpass';lp.frequency.value=260;drone.gain.value=.5;
        [[55,'sine',.5],[55.45,'sine',.45],[82.6,'triangle',.18],[116.5,'sine',.06]].forEach(([f,ty,gn])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.value=f;g.gain.value=gn;o.connect(g);g.connect(lp);o.start();nodes.push(o);});
        const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.07;lg.gain.value=.22;lfo.connect(lg);lg.connect(drone.gain);lfo.start();nodes.push(lfo);
        lp.connect(drone);drone.connect(ambBus);
        const s=ctx.createBufferSource(),b=ctx.createBiquadFilter(),g=ctx.createGain();
        s.buffer=noiseBuf;s.loop=true;b.type='lowpass';b.frequency.value=380;g.gain.value=.22;s.connect(b);b.connect(g);g.connect(ambBus);s.start();nodes.push(s);
        const wl=ctx.createOscillator(),wg=ctx.createGain();wl.frequency.value=.11;wg.gain.value=140;wl.connect(wg);wg.connect(b.frequency);wl.start();nodes.push(wl);
        ambNodes=nodes;
      }
      ambBus.gain.cancelScheduledValues(n);ambBus.gain.setTargetAtTime(.32,n,1.5);
      clearTimeout(crackleT);crackle();
    }else{
      ambBus.gain.cancelScheduledValues(n);ambBus.gain.setTargetAtTime(.0001,n,.8);
      clearTimeout(crackleT);
      const old=ambNodes;ambNodes=null;setTimeout(()=>{if(!ambOn&&old)old.forEach(o=>{try{o.stop()}catch(e){}});},4000);
    }
  }
  function setVol(v){S.vol=v;if(v>0&&S.muted)S.muted=false;applyLevel();save();ui();}
  function toggle(){S.muted=!S.muted;if(!S.muted&&S.vol<=0)S.vol=.6;init();applyLevel();save();ui();}
  function ui(){
    $('vol').value=Math.round(S.vol*100);$('slash').classList.toggle('hidden',!S.muted);$('waves').classList.toggle('hidden',S.muted);
    $('mute').setAttribute('aria-label',S.muted?'Unmute sound':'Mute sound');
  }
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();});
  ['pointerdown','touchend','keydown'].forEach(e=>addEventListener(e,()=>{if(ctx&&ctx.state!=='running'&&!document.hidden)ctx.resume();},{passive:true}));

  define('click',(t,o)=>{tone(o,{f:1100,f2:650,dur:.05,gain:.12,type:'triangle'});noise(o,{dur:.02,gain:.05,type:'highpass',f:3000});},{gap:.05});
  define('paper',(t,o)=>{noise(o,{dur:.16,gain:.1,f:2400,f2:900,q:.6,attack:.03});noise(o,{t:.12,dur:.12,gain:.07,f:3200,f2:1500,q:.6,attack:.02});},{gap:.25});
  define('type',(t,o)=>{for(let i=0;i<4;i++)noise(o,{t:i*.055+Math.random()*.02,dur:.018,gain:.07,type:'highpass',f:2500+Math.random()*1500,attack:.001});},{gap:.3});
  define('clue',(t,o)=>{
    tone(o,{f:62,f2:48,dur:1.5,gain:.3,attack:.35});tone(o,{f:110,dur:1.4,gain:.06,attack:.4,type:'triangle',lp:400});tone(o,{f:116.5,dur:1.4,gain:.05,attack:.4,type:'triangle',lp:400});
    tone(o,{f:1760,f2:1660,t:.25,dur:1.1,gain:.025,attack:.25});noise(o,{dur:1,gain:.05,f:500,f2:2500,q:2,attack:.6});
  },{gap:.6});
  define('evidence',(t,o)=>{tone(o,{f:659,dur:.9,gain:.1,type:'triangle',attack:.004});tone(o,{f:1318,dur:.6,gain:.03});tone(o,{f:987,t:.11,dur:1,gain:.09,type:'triangle',attack:.004});tone(o,{f:1975,t:.11,dur:.7,gain:.025});},{gap:.4});
  define('reveal',(t,o)=>{
    tone(o,{f:70,f2:38,dur:2.2,gain:.42,attack:.05});tone(o,{f:98,f2:92,dur:2,gain:.1,type:'sawtooth',lp:260,attack:.3});tone(o,{f:103.8,f2:97,dur:2,gain:.08,type:'sawtooth',lp:260,attack:.3});
    noise(o,{dur:1.6,gain:.1,type:'lowpass',f:200,f2:1200,q:1,attack:.5});
  },{gap:1});
  define('transition',(t,o)=>{noise(o,{dur:.45,gain:.09,f:250,f2:1400,q:1.2,attack:.15});tone(o,{f:90,f2:60,dur:.3,gain:.08});},{gap:.3});
  define('tick',(t,o)=>{tone(o,{f:70,f2:45,dur:.14,gain:.3,attack:.004});tone(o,{f:60,f2:40,t:.16,dur:.12,gain:.18,attack:.004});},{gap:.7});
  define('lose',(t,o)=>{tone(o,{f:82,f2:41,dur:2.6,gain:.4,attack:.05});tone(o,{f:123,f2:116,dur:2.2,gain:.07,type:'sawtooth',lp:240,attack:.4});noise(o,{dur:1.2,gain:.08,type:'lowpass',f:160,f2:700,attack:.4});},{gap:1});

  $('mute').addEventListener('click',toggle);
  $('vol').addEventListener('input',e=>{init();setVol(e.target.value/100);});
  $('vol').addEventListener('change',()=>play('click'));
  ui();
  return{play,ambience,define,tone,noise,tick:()=>play('tick'),init};
})();
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x040302);
scene.fog=new THREE.Fog(0x040302,14,30);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.05,60);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
function mesh(geo,mat,x=0,y=0,z=0,parent=scene){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);parent.add(m);return m;}
function tex(w,h,draw,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;}

// ---------- Room ----------
const floorTex=tex(512,512,(g,w)=>{for(let r=0;r<8;r++){let x=-Math.random()*200;while(x<w){const len=150+Math.random()*200,v=.7+Math.random()*.5;g.fillStyle=`rgb(${90*v|0},${52*v|0},${28*v|0})`;g.fillRect(x,r*64,len,64);g.strokeStyle='rgba(0,0,0,.18)';for(let k=0;k<6;k++){const y=r*64+Math.random()*64;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+len/3,y+Math.random()*8-4,x+2*len/3,y+Math.random()*8-4,x+len,y);g.stroke();}g.fillStyle='#1a0e06';g.fillRect(x,r*64,3,64);x+=len;}g.fillStyle='#1a0e06';g.fillRect(0,r*64,w,3);}},4,4);
const wallTex=tex(128,256,(g,w,h)=>{g.fillStyle='#3a1414';g.fillRect(0,0,w,h);g.fillStyle='#2a0c0c';g.fillRect(0,0,w/2,h);g.fillStyle='rgba(190,150,80,.25)';g.fillRect(w/2-2,0,2,h);g.fillRect(w-2,0,2,h);},10,1);
const rugTex=tex(512,512,(g,w,h)=>{g.fillStyle='#4a0f12';g.fillRect(0,0,w,h);g.strokeStyle='#b08a3a';g.lineWidth=10;g.strokeRect(24,24,w-48,h-48);g.lineWidth=3;g.strokeRect(50,50,w-100,h-100);g.fillStyle='#2a1a3a';g.beginPath();g.moveTo(w/2,90);g.lineTo(w-90,h/2);g.lineTo(w/2,h-90);g.lineTo(90,h/2);g.fill();g.strokeStyle='#8a6a2e';g.stroke();g.fillStyle='#6a1a1a';g.beginPath();g.arc(w/2,h/2,60,0,7);g.fill();});
const floor=mesh(new THREE.PlaneGeometry(20,20),M(0xffffff,{map:floorTex,roughness:.55}));floor.rotation.x=-Math.PI/2;
const ceil=mesh(new THREE.PlaneGeometry(20,20),M(0x1a110b),0,5.5,0);ceil.rotation.x=Math.PI/2;
const wallMat=M(0xffffff,{map:wallTex}),panelMat=M(0x2a170b,{roughness:.6});
[[0,-10,0],[0,10,Math.PI],[-10,0,Math.PI/2],[10,0,-Math.PI/2]].forEach(([x,z,r])=>{
  mesh(new THREE.PlaneGeometry(20,5.5),wallMat,x,2.75,z).rotation.y=r;
  mesh(new THREE.BoxGeometry(20,1.1,.08),panelMat,x,.55,z).rotation.y=r;
});
const rug=mesh(new THREE.PlaneGeometry(7.5,6.5),M(0xffffff,{map:rugTex,roughness:1}),0,.01,0);rug.rotation.x=-Math.PI/2;

// glow sprite + candles
const glowTex=tex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);});
const glow=(c,o=1)=>new THREE.SpriteMaterial({map:glowTex,color:c,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:o});
const waxM=M(0xeee0c0,{roughness:.5}),flameM=new THREE.MeshBasicMaterial({color:0xffd070}),brass=M(0xb08a3a,{metalness:.8,roughness:.35}),candleGlow=glow(0xffa040,.8);
const flames=[];
function candle(x,y,z,parent=scene,h=.22){
  mesh(new THREE.CylinderGeometry(.03,.03,h,10),waxM,x,y+h/2,z,parent);
  const f=mesh(new THREE.SphereGeometry(.018,8,8),flameM,x,y+h+.03,z,parent);f.scale.y=1.8;
  const s=new THREE.Sprite(candleGlow);s.scale.setScalar(.3);s.position.set(x,y+h+.035,z);parent.add(s);
  flames.push({f,s,ph:Math.random()*9});
}

// table + poison glass
const darkWood=M(0x2e1a0c,{roughness:.45});
mesh(new THREE.CylinderGeometry(1.1,1.1,.07,40),darkWood,0,.76,0);
mesh(new THREE.CylinderGeometry(.1,.14,.72,12),darkWood,0,.38,0);
mesh(new THREE.CylinderGeometry(.5,.55,.06,24),darkWood,0,.03,0);
const glassPts=[[0,0],[.07,0],[.07,.01],[.012,.02],[.01,.11],[.04,.13],[.07,.17],[.075,.25]].map(p=>new THREE.Vector2(p[0],p[1]));
mesh(new THREE.LatheGeometry(glassPts,24),new THREE.MeshStandardMaterial({color:0xddeeff,transparent:true,opacity:.3,roughness:.05,side:THREE.DoubleSide}),0,.795,0);
const poisonM=new THREE.MeshStandardMaterial({color:0x40ff60,emissive:0x30ff40,emissiveIntensity:1,transparent:true,opacity:.9});

    cl=h.clone().setY(h.y-.22);cp=h.clone().add(new THREE.Vector3(Math.sin(ry)*1.6+Math.cos(ry)*.2,.08,Math.cos(ry)*1.6-Math.sin(ry)*.2));}
  const k=1-Math.exp(-dt*3.5);camPos.lerp(cp,k);camLook.lerp(cl,k);camera.position.copy(camPos);
  if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake*.35;camera.position.y+=(Math.random()-.5)*shake*.35;}
  camera.lookAt(camLook);
  people.forEach((p,i)=>{
    tmp.copy(p.root.position).setY(2.02*p.root.scale.y).project(camera);
    const show=state!=='intro'&&focus<.3&&tmp.z<1;tags[i].style.display=show?'block':'none';
    if(show)tags[i].style.transform=`translate(-50%,-100%) translate(${(tmp.x+1)/2*innerWidth}px,${(1-tmp.y)/2*innerHeight}px)`;
  });
  renderer.render(scene,camera);
}
loop();
</script>
